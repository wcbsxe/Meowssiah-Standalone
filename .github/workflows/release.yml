name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check version and public files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
          npm run check:publish
      - name: Install pinned dependencies
        run: npm ci
      - name: Build Windows portable
        run: npm run build
      - name: Prepare release files
        run: npm run release:assets
      - name: Publish new tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "Meowssiah $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are not overwritten' }
          Get-ChildItem "dist-$version/public" -File | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          }
